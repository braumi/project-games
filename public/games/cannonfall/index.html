/* ---------- level select (paged; 1000 levels) ---------- */
class LevelsScene extends Scene {
  enter() {
    this.per = 60;
    this.page = Math.floor((Progress.furthest() - 1) / this.per);
    overlayEl.hidden = false;
    this.root = el('div', { class: 'center' });
    overlayEl.append(this.root);
    this.render();
  }
  render() {
    const furthest = Progress.furthest();
    const pages = Math.ceil(CONFIG.maxLevel / this.per);
    this.page = Math.max(0, Math.min(pages - 1, this.page));
    const start = this.page * this.per + 1;
    const grid = el('div', { class: 'levgrid' });
    for (let n = start; n < start + this.per && n <= CONFIG.maxLevel; n++) {
      const locked = n > furthest;
      const st = Progress.starsFor(n);
      grid.append(el('button', {
        class: 'lev' + (locked ? ' locked' : ''),
        disabled: locked ? '' : null,
        onclick: () => { if (!locked) { Sfx.play('click'); Scenes.go('game', { level: n }); } },
      }, String(n), el('span', { class: 'st' }, st ? '\u2605'.repeat(st) : '')));
    }
    this.root.innerHTML = '';
    this.root.append(
      el('h2', { class: 'banner' }, 'Levels'),
      grid,
      el('div', { class: 'pager' },
        button('\u2039', () => { this.page--; this.render(); }, 'sec'),
        el('span', { class: 'hint' }, `${start}\u2013${Math.min(CONFIG.maxLevel, start + this.per - 1)} of ${CONFIG.maxLevel}`),
        button('\u203a', () => { this.page++; this.render(); }, 'sec')),
      button('Back', () => Scenes.go('menu'), 'sec'));
  }
  onAction(a) { if (a === 'pause' || a === 'confirm') Scenes.go('menu'); }
}

class GameOverScene extends Scene {
  enter({ score = 0, rank = 0, isBest = false, level = 1, won = false } = {}) {
    this.enteredAt = performance.now();
    overlayEl.hidden = false;
    const line = isBest ? 'NEW BEST!' : rank ? `#${rank} on the leaderboard` : `Best: ${fmt(HighScores.best())}`;
    overlayEl.append(el('div', { class: 'center' },
      el('div', { class: 'panel' },
        el('h2', {}, won ? 'Run Complete!' : 'Run Over'),
        el('p', { class: 'sub' }, `Reached level ${level}`),
        el('div', { class: 'big' }, fmt(score)),
        el('p', { style: `font-weight:700;margin:0;color:${isBest ? '#ffd166' : '#a8b4cf'}` }, line)),
      el('div', { class: 'col' },
        button('Play Again', () => Scenes.go('game', { level: Progress.furthest() })),
        button('High Scores', () => Scenes.go('highscores'), 'sec'),
        button('Main Menu', () => Scenes.go('menu'), 'sec'))));
  }
  onAction(a) {
    if (performance.now() - this.enteredAt < 800) return;    // don't let a stray fire skip this screen
    if (a === 'confirm' || a === 'restart') Scenes.go('game', { level: Progress.furthest() });
    else if (a === 'pause') Scenes.go('menu');
  }
}

/* ---------- the game scene ----------
   RULE DECISIONS (points the spec left open):
   - Scoring is per level, not a running total: each level starts at zero and is scored on its own.
   - A level scores block points (with combos) + a 500 clear bonus + 250 for every ball left in the
     rack, so the more balls you spend the less you earn.
   - Stars are read off that score: clearing at par (ceil(blocks/12) shots) earns three.
   - The ball budget is deliberately generous so no level can strand a player; the stars, not the
     budget, are what measure skill.
   - The combo multiplier caps at x5 and belongs to a single shot; firing again starts a new burst.
   - A level is cleared the instant the last block leaves the pedestal, even on the final ball.
     It is failed only once the balls are gone AND the world has genuinely come to rest.
   - Restart replays the current level from the score it started with, and records no high score.
   - Progress and bonuses are banked the moment a level is cleared, not when the panel appears.
   - Cleared blocks are removed ~1.4 s after they land, so debris does not pile up.
   - Swipes are recognised (so the shell can report them) but ignored as a control. */
class GameScene extends Scene {
  enter({ level = 1 } = {}) {
    this.levelNo = Math.max(1, Math.min(CONFIG.maxLevel, level));
    this.bonus = 0;                    // level-end bonuses + anything added by the test hook
    this.state = 'playing';            // 'playing' | 'paused' | 'over'
    this.panel = null; this.savedPanel = null;
    this.acc = 0;
    this.aimNdc = { x: 0, y: 0.05 };
    this.levelDone = false;            // guards double-counting a finished level

    this.level = Logic.level(this.levelNo);
    this.sim = new Sim(RAPIER, this.level);
    View.buildLevel(this.sim);
    this.updateAim();

    hudEl.hidden = false;
    this.buildHud();
    this.refreshHud();
    this.flash(`Level ${this.levelNo}`, 900);
  }

  /* ---------- HUD ---------- */
  buildHud() {
    this.elLevel = el('div', { class: 'v' }, String(this.levelNo));
    this.elScore = el('div', { class: 'v' }, '0');
    this.elBest = el('div', { class: 'v' }, fmt(HighScores.best()));
    this.elAmmo = el('div', { id: 'ammo' });
    this.elMsg = el('div', { id: 'msg' });
    const chip = (k, v) => el('div', { class: 'chip' }, el('div', { class: 'k' }, k), v);
    hudEl.append(
      el('div', { class: 'hudrow' },
        chip('LEVEL', this.elLevel), chip('SCORE', this.elScore), chip('BEST', this.elBest),
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn sec', id: 'pausebtn', onclick: (e) => { e.preventDefault(); this.togglePause(); } }, 'II')),
      this.elAmmo, this.elMsg);
  }
  get score() { return this.sim.blockPoints + this.bonus; }        // this level only
  refreshHud() {
    this.elScore.textContent = fmt(this.score);
    this.elBest.textContent = fmt(Math.max(Progress.bestScore(this.levelNo), this.score));
    this.elAmmo.innerHTML = '';
    for (let i = 0; i < this.sim.ballsTotal; i++)
      this.elAmmo.append(el('div', { class: 'pip' + (i < this.sim.ballsTotal - this.sim.ballsLeft ? ' spent' : '') }));
  }
  flash(text, ms = 1000) {
    this.elMsg.textContent = text;
    this.elMsg.style.opacity = '1';
    this.later(ms, () => { if (this.elMsg) this.elMsg.style.opacity = '0'; });
  }

  /* ---------- aiming and firing ---------- */
  onAim(ndc) {
    if (this.state !== 'playing' || this.panel) return;
    this.aimNdc = ndc;
    this.updateAim();
  }
  updateAim() {
    this.aimPoint = View.aimPointFrom(this.aimNdc);
    View.aimAt(this.aimPoint);
  }
  canFire() { return this.state === 'playing' && !this.panel && this.sim.status === 'playing' && this.sim.ballsLeft > 0 && this.sim.cooldown === 0; }
  fire() {
    if (!this.canFire()) return false;
    const ok = this.sim.fire({ x: this.aimPoint.x, y: this.aimPoint.y, z: this.aimPoint.z });
    if (ok) {
      Sfx.play('fire');
      View.shake = Math.min(0.35, View.shake + 0.14);
      this.refreshHud();
    }
    return ok;
  }

  onAction(a, source, data) {
    if (a === 'pause') return this.togglePause();
    if (this.state === 'paused') { if (a === 'confirm') this.resume(); return; }
    if (this.panel) {                                   // a result panel owns the input
      if (a === 'confirm') this.panel.querySelector('button')?.click();
      return;
    }
    if (this.state !== 'playing') return;
    if (a === 'restart') return this.restart();
    if (source === 'swipe') return;                     // swipes are not a control in this game
    if (a === 'press') { if (data) this.onAim(data); return this.fire(); }
    if (a === 'fire' || a === 'confirm') return this.fire();
    const step = 0.045;
    if (a === 'left') this.onAim({ x: this.aimNdc.x - step, y: this.aimNdc.y });
    else if (a === 'right') this.onAim({ x: this.aimNdc.x + step, y: this.aimNdc.y });
    else if (a === 'up') this.onAim({ x: this.aimNdc.x, y: this.aimNdc.y + step });
    else if (a === 'down') this.onAim({ x: this.aimNdc.x, y: this.aimNdc.y - step });
  }

  /* ---------- pause ---------- */
  togglePause() {
    if (this.state === 'over') return;
    if (this.state === 'paused') return this.resume();
    this.state = 'paused';
    this.savedPanel = this.panel;                       // keep a result panel underneath
    if (this.savedPanel) { this.savedPanel.style.display = 'none'; this.panel = null; }
    this.showPanel('Paused', '', [
      ['Resume', () => this.resume()],
      ['Restart', () => this.restart(), 'sec'],
      ['Main Menu', () => { this.endRun({ toMenu: true }); }, 'sec'],
    ]);
  }
  resume() {
    this.hidePanel();
    if (this.savedPanel) { this.savedPanel.style.display = ''; overlayEl.hidden = false; this.panel = this.savedPanel; this.savedPanel = null; }
    if (this.state === 'paused') this.state = 'playing';
  }
  onHidden() { if (this.state === 'playing') this.togglePause(); }

  showPanel(title, sub, buttons) {
    this.hidePanel();
    overlayEl.hidden = false;
    const p = el('div', { class: 'center' },
      el('div', { class: 'scrim' }),
      el('div', { class: 'panel' }, el('h2', {}, title), sub ? el('p', { class: 'sub' }, sub) : null),
      el('div', { class: 'col' }, buttons.map(([label, fn, cls]) => button(label, fn, cls || ''))));
    overlayEl.append(p);
    this.panel = p;
    return p;
  }
  hidePanel() { if (this.panel) { this.panel.remove(); this.panel = null; } if (!overlayEl.children.length) overlayEl.hidden = true; }

  /* ---------- level flow ---------- */
  restart() { Scenes.go('game', { level: this.levelNo }); }
  nextLevel() {
    if (this.levelNo >= CONFIG.maxLevel) return this.endRun({ won: true });
    Scenes.go('game', { level: this.levelNo + 1 });
  }
  /** Ends the run: records the high score once, then shows the game-over screen (or the menu). */
  endRun({ toMenu = false, won = false } = {}) {
    if (this.state === 'over') return;
    const score = this.score;
    this.state = 'over';
    const { rank, isBest } = HighScores.add(score, this.levelNo);
    if (toMenu) Scenes.go('menu');
    else Scenes.go('gameover', { score, rank, isBest, level: this.levelNo, won });
  }

  onLevelCleared() {
    if (this.levelDone) return;
    this.levelDone = true;
    // bonuses and progress are banked immediately -- quitting during the panel can't lose them
    this.bonus += Logic.clearBonus() + Logic.ballBonus(this.sim.ballsLeft);
    const stars = Logic.stars(this.score, this.sim.blocks.length, this.sim.ballsTotal);
    Progress.record(this.levelNo, stars, this.score);
    this.refreshHud();
    Sfx.play('win');
    this.flash('Cleared!', 1200);
    this.later(900, () => {
      if (this.state === 'over') return;
      const [, t2, t3] = Logic.starTargets(this.sim.blocks.length, this.sim.ballsTotal);
      const gap = stars === 3 ? '' : `   \u00b7   ${fmt((stars === 1 ? t2 : t3) - this.score)} more for the next star`;
      this.showPanel(`${'\u2605'.repeat(stars)}${'\u2606'.repeat(3 - stars)}  Level ${this.levelNo}`,
        `${fmt(this.score)} points   \u00b7   ${this.sim.shotsFired} shot${this.sim.shotsFired === 1 ? '' : 's'}   \u00b7   ${this.sim.ballsLeft} balls left${gap}`,
        [['Next Level', () => this.nextLevel()], ['End Run', () => this.endRun(), 'sec']]);
    });
  }
  onLevelFailed() {
    if (this.levelDone) return;
    this.levelDone = true;
    Sfx.play('lose');
    this.flash('Out of balls', 1200);
    this.later(700, () => {
      if (this.state === 'over') return;
      this.showPanel('Out of balls', `${this.sim.remaining} block${this.sim.remaining === 1 ? '' : 's'} still standing`,
        [['Try Again', () => this.restart()], ['End Run', () => this.endRun(), 'sec']]);
    });
  }

  /* ---------- per-frame ---------- */
  update(dtMs) {
    this.tickTimers(dtMs, this.state === 'paused');
    if (this.state !== 'playing' || !this.sim) return;

    this.acc += Math.min(dtMs, 100) / 1000;
    let steps = 0;
    while (this.acc >= PHYS.dt && steps < 6) {
      const events = this.sim.tick();
      this.acc -= PHYS.dt;
      steps++;
      for (const ev of events) this.handleEvent(ev);
    }
    if (steps === 6) this.acc = 0;                       // never spiral after a long stall
    View.syncFromSim(this.sim);
    if (!this.levelDone) {
      if (this.sim.status === 'cleared') this.onLevelCleared();
      else if (this.sim.status === 'failed') this.onLevelFailed();
    }
  }

  handleEvent(ev) {
    switch (ev.type) {
      case 'clear': {
        const b = this.sim.blocks[ev.id];
        const p = b && !b.removed ? b.body.translation() : { x: 0, y: PHYS.pedestalTop + 1, z: 0 };
        Sfx.play('clear');
        popText(p, `+${ev.points}`, ev.combo > 1 ? '#ffd166' : '#dfe7f5', ev.combo > 1 ? 26 : 20);
        if (ev.combo === 2) popText({ x: p.x, y: p.y + 0.7, z: p.z }, 'x2', '#ff8a5c', 28);
        else if (ev.combo > 2) popText({ x: p.x, y: p.y + 0.7, z: p.z }, `x${ev.combo}`, '#ff6a43', 30);
        this.refreshHud();
        break;
      }
      case 'blast': View.addBlast(ev.at); Sfx.play('blast'); break;
      case 'shatter': View.addPuff(ev.at); Sfx.play('glass'); break;
      case 'fire': break;
      default: break;
    }
  }

  exit() { if (this.sim) { this.sim.destroy(); this.sim = null; } View.clearLevel(); View.crosshair.visible = false; }

  debugState() {
    return {
      state: this.state, score: this.score, level: this.levelNo,
      simStatus: this.sim ? this.sim.status : null,
      ballsLeft: this.sim ? this.sim.ballsLeft : 0,
      ballsTotal: this.sim ? this.sim.ballsTotal : 0,
      remaining: this.sim ? this.sim.remaining : 0,
      cleared: this.sim ? this.sim.clearedCount : 0,
      panel: !!this.panel, levelDone: this.levelDone,
    };
  }
  /** Used by the test hook to end a run on demand. */
  addScore(n) { this.bonus += n; this.refreshHud(); }
}

/* ##### TESTS ##### */
function assert(c, m = 'assertion failed') { if (!c) throw new Error(m); }
function assertEq(a, b, m = '') { const A = JSON.stringify(a), B = JSON.stringify(b); if (A !== B) throw new Error(`${m} expected ${B} got ${A}`); }
function simFor(n) { return new Sim(RAPIER, Logic.level(n)); }

const TESTS = [
  ['ballistics: the ball really passes through the crosshair point', () => {
    for (const target of [{ x: 0, y: 2.0, z: 1.2 }, { x: 1.6, y: 4.2, z: -1.1 }, { x: -1.4, y: 1.9, z: 1.2 }, { x: 0, y: 4.6, z: -1.6 }]) {
      // integrate from where the ball is actually created, with the velocity it actually gets
      const { spawn, vel } = Sim.solveShot(target);
      const horiz = Math.hypot(target.x - spawn.x, target.z - spawn.z);
      const t = horiz / Math.hypot(vel.x, vel.z);
      const y = spawn.y + vel.y * t - 0.5 * PHYS.gravity * t * t;
      assert(Math.abs(y - target.y) < 0.01, `crosshair lies: ball passes ${(y - target.y).toFixed(3)} m off`);
    }
  }],

  ['levels are deterministic and well formed', () => {
    for (const n of [1, 7, 40, 137, 500, 1000]) {
      const a = Logic.level(n), b = Logic.level(n);
      assertEq(a.blocks, b.blocks, `level ${n} must be identical every time`);
      assert(a.blocks.length >= MIN_BLOCKS, `level ${n} has too few blocks`);
      assert(a.blocks.length <= MAX_BLOCKS, `level ${n} has too many blocks`);
      assert(a.balls >= 15 && a.balls <= 24, `level ${n} ball count out of range`);
      assertEq(Logic.overlaps(a.blocks), [], `level ${n} spawns overlapping blocks`);
      for (const bl of a.blocks) {
        assert(Math.hypot(bl.x, bl.z) <= PHYS.pedestalRadius, `level ${n} block outside the pedestal`);
        assert(bl.y - bl.sy / 2 >= PHYS.pedestalTop - 1e-6, `level ${n} block starts below the pedestal top`);
        assert(TYPES[bl.type], `level ${n} unknown block type ${bl.type}`);
      }
    }
  }],

  ['every level is a real stack and the ramp grows', () => {
    for (const n of [1, 2, 9, 57, 300, 1000])
      assert(Logic.level(n).blocks.length >= MIN_BLOCKS, `level ${n} has fewer than MIN_BLOCKS blocks`);
    assert(Logic.targetBlocks(300) > Logic.targetBlocks(1), 'difficulty must ramp up');
    assert(Logic.paletteFor(1).length === 1, 'level 1 is wood only');
    assert(Logic.paletteFor(40).includes('steel'), 'steel unlocks by level 40');
  }],

  ['scoring: bursts, bonuses and stars', () => {
    assertEq(Logic.burstScore(1), 100);
    assertEq(Logic.burstScore(3), 600);              // 100 + 200 + 300
    assertEq(Logic.blockScore(9), 500, 'multiplier caps at x5');
    assertEq(Logic.ballBonus(4), 1000);
    assertEq(Logic.par(24), 3); assertEq(Logic.par(60), 5);
    // stars come off the score, and spending balls costs points
    for (const blocks of [50, 66, 84]) {
      const balls = Logic.ballsFor(blocks);
      const [t1, t2, t3] = Logic.starTargets(blocks, balls);
      assert(t1 < t2 && t2 < t3, 'star targets must increase');
      assertEq(Logic.stars(t3, blocks, balls), 3);
      assertEq(Logic.stars(t2, blocks, balls), 2);
      assertEq(Logic.stars(t1, blocks, balls), 1);
      // clearing at par with no combos is exactly three stars
      const atPar = 100 * blocks + Logic.clearBonus() + Logic.ballBonus(balls - Logic.par(blocks));
      assertEq(Logic.stars(atPar, blocks, balls), 3, 'clearing at par should be three stars');
      // the same clear using three more balls must score less and drop a star
      const sloppy = 100 * blocks + Logic.clearBonus() + Logic.ballBonus(balls - Logic.par(blocks) - 3);
      assert(sloppy < atPar, 'using more balls must score less');
      assert(Logic.stars(sloppy, blocks, balls) < 3, 'a sloppy clear should not be three stars');
      // the budget always covers the worst measured need, so a level can never strand you
      assert(balls >= Logic.par(blocks) + 5, `budget too tight for ${blocks} blocks`);
    }
  }],

  ['a structure stands on its own when nobody shoots at it', () => {
    for (const n of [1, 5, 8, 23]) {
      const s = simFor(n);
      for (let i = 0; i < 120; i++) s.tick();
      assertEq(s.clearedCount, 0, `level ${n} collapsed on its own`);
      assertEq(s.status, 'playing', `level ${n} ended by itself`);
      s.destroy();
    }
  }],

  ['a block is counted exactly once', () => {
    const s = simFor(1);
    s.fire(s.botAim(0));
    let clears = 0;
    for (let i = 0; i < 400; i++) for (const e of s.tick()) if (e.type === 'clear') clears++;
    const ids = new Set();
    for (const b of s.blocks) if (b.cleared) ids.add(b.id);
    assertEq(clears, ids.size, 'clear events must match the number of cleared blocks');
    s.destroy();
  }],

  ['clearing the last block wins even with no balls left', () => {
    const s = simFor(1);
    s.ballsLeft = 1;
    while (s.status === 'playing') {
      if (s.ballsLeft > 0 && s.cooldown === 0 && s.settled && s.ballsInFlight === 0) s.fire(s.botAim(0));
      // force the remaining blocks off the pedestal on the same tick the last ball is gone
      if (s.ballsLeft === 0 && s.ticks > 60) for (const b of s.blocks) if (!b.cleared) b.body.setTranslation({ x: 9, y: 3, z: 0 }, true);
      s.tick();
      if (s.ticks > 1200) break;
    }
    assertEq(s.status, 'cleared', 'a clear on the final ball must win, not fail');
    s.destroy();
  }],

  ['a level is never failed while blocks are still moving', () => {
    const s = simFor(2);
    s.ballsLeft = 1;
    s.fire(s.botAim(0));
    let sawMovingFail = false;
    for (let i = 0; i < 600; i++) {
      s.tick();
      if (s.status === 'failed') {
        let moving = false;
        for (const b of s.blocks) if (!b.removed && Math.hypot(b.body.linvel().x, b.body.linvel().y, b.body.linvel().z) > PHYS.settleSpeed) moving = true;
        if (moving) sawMovingFail = true;
        break;
      }
    }
    assert(!sawMovingFail, 'failed while the world was still settling');
    s.destroy();
  }],

  ['firing is refused when it should be', () => {
    const s = simFor(1);
    assert(s.fire({ x: 0, y: 3, z: 0 }), 'first shot should fire');
    assert(!s.fire({ x: 0, y: 3, z: 0 }), 'cooldown must block an instant second shot');
    for (let i = 0; i < 12; i++) s.tick();
    assert(s.fire({ x: 0, y: 3, z: 0 }), 'should fire again after the cooldown');
    s.ballsLeft = 0;
    for (let i = 0; i < 12; i++) s.tick();
    assert(!s.fire({ x: 0, y: 3, z: 0 }), 'no balls left means no shot');
    s.status = 'cleared';
    s.ballsLeft = 3;
    assert(!s.fire({ x: 0, y: 3, z: 0 }), 'a finished level must not accept shots');
    s.destroy();
  }],

  ['balls are removed after leaving the arena (no leak)', () => {
    const s = simFor(1);
    s.fire({ x: 0, y: 40, z: -30 });                    // straight over the top
    for (let i = 0; i < 700; i++) s.tick();
    assertEq(s.ballsInFlight, 0, 'the ball should be gone');
    s.destroy();
  }],

  ['the combo multiplier belongs to one shot, not to a rolling timer', () => {
    // two blocks knocked off by two separate shots must score 100 + 100, not 100 + 200
    const lv = Logic.level(1);
    const s = new Sim(RAPIER, lv);
    for (let i = 0; i < 40; i++) s.tick();
    const push = () => {
      const b = s.blocks.find(x => !x.cleared && !x.removed);
      b.body.setTranslation({ x: 9, y: 3, z: 0 }, true);
    };
    s.fire({ x: 0, y: 9, z: -9 }); push();                  // shot 1 clears one block
    for (let i = 0; i < 6; i++) s.tick();
    const afterFirst = s.blockPoints;
    for (let i = 0; i < 12; i++) s.tick();                  // well inside the old 0.9 s window
    s.fire({ x: 0, y: 9, z: -9 }); push();                  // shot 2 clears one block
    for (let i = 0; i < 6; i++) s.tick();
    assertEq(afterFirst, 100, 'the first clear scores one block');
    assertEq(s.blockPoints, 200, 'a second shot must restart the combo, not extend it');
    s.destroy();
  }],

  ['cleared blocks are eventually removed from the world', () => {
    const s = simFor(30);
    const pushed = s.blocks.slice(0, 3);                    // leave the rest standing so play continues
    pushed.forEach((b, i) => b.body.setTranslation({ x: 4 + i * 0.9, y: 0.4, z: 0 }, true));
    for (let i = 0; i < 30; i++) s.tick();
    assertEq(pushed.filter(b => b.cleared).length, 3, 'blocks off the pedestal should count as cleared');
    assertEq(s.status, 'playing', 'the level should still be in play');
    for (let i = 0; i < 60 * 4; i++) s.tick();
    assertEq(pushed.filter(b => !b.removed).length, 0, 'debris was never cleaned up');
    s.destroy();
  }],

  ['physics keeps running after a level ends so nothing freezes mid-air', () => {
    const s = simFor(1);
    for (const b of s.blocks) b.body.setTranslation({ x: 6, y: 4, z: 0 }, true);
    for (let i = 0; i < 5; i++) s.tick();
    assertEq(s.status, 'cleared', 'pushing everything off clears the level');
    const t0 = s.time;
    for (let i = 0; i < 30; i++) s.tick();
    assert(s.time > t0, 'the world must keep stepping after the level is cleared');
    s.destroy();
  }],

  ['a barrel explodes once and shifts its neighbours', () => {
    const lv = Logic.level(1);
    lv.blocks.forEach(b => { b.type = 'wood'; });
    lv.blocks[0].type = 'barrel';
    const s = new Sim(RAPIER, lv);
    for (let i = 0; i < 60; i++) s.tick();              // settle
    const before = s.blocks.slice(1).map(b => ({ ...b.body.translation() }));
    const bp = s.blocks[0].body.translation();
    s.blocks[0].body.setLinvel({ x: 0, y: 0, z: -12 }, true);   // a hard knock detonates it
    let blasts = 0;
    for (let i = 0; i < 120; i++) for (const e of s.tick()) if (e.type === 'blast') blasts++;
    assertEq(blasts, 1, 'a barrel must detonate exactly once');
    assert(s.blocks[0].cleared, 'the barrel counts as cleared');
    let moved = 0;
    s.blocks.slice(1).forEach((b, i) => {
      if (b.removed) { moved++; return; }                 // already tidied away: it certainly moved
      const p = b.body.translation();
      if (Math.hypot(p.x - before[i].x, p.y - before[i].y, p.z - before[i].z) > 0.05) moved++;
    });
    assert(moved > 0, 'the blast should move nearby blocks');
    assert(bp, 'barrel had a position');
    s.destroy();
  }],

  ['glass shatters when hit hard', () => {
    const lv = Logic.level(1);
    lv.blocks.forEach(b => { b.type = 'wood'; });
    lv.blocks[0].type = 'glass';
    const s = new Sim(RAPIER, lv);
    for (let i = 0; i < 60; i++) s.tick();
    s.blocks[0].body.setLinvel({ x: 0, y: 0, z: -14 }, true);
    let shattered = 0;
    for (let i = 0; i < 90; i++) for (const e of s.tick()) if (e.type === 'shatter') shattered++;
    assertEq(shattered, 1, 'glass shatters once');
    assert(s.blocks[0].cleared, 'shattered glass counts as cleared');
    assert(s.blocks[0].removed, 'shattered glass leaves the world');
    s.destroy();
  }],

  ['the simulation is fixed-step: chunking the ticks changes nothing', () => {
    // Fire on fixed tick numbers, so the only thing that varies is how the ticks are grouped.
    const shots = { 5: { x: 0.3, y: 2.6, z: 0 }, 240: { x: -0.4, y: 3.1, z: 0.2 } };
    const run = (chunk) => {
      const s = simFor(4);
      let t = 0;
      while (t < 600) {
        for (let i = 0; i < chunk && t < 600; i++, t++) {
          if (shots[t]) s.fire(shots[t]);
          s.tick();
        }
      }
      const snap = s.snapshot();
      s.destroy();
      return snap;
    };
    assertEq(run(1), run(7), 'stepping in different chunk sizes must give the same world');
  }],

  ['the bot clears a sample of levels within their ball budget', () => {
    for (const n of [1, 3, 12, 27]) {
      const s = simFor(n);
      const r = s.runBot();
      assertEq(r.status, 'cleared', `level ${n} was not clearable (left ${s.remaining} of ${s.blocks.length})`);
      assert(r.shots <= s.ballsTotal, `level ${n} used more shots than it had balls`);
      s.destroy();
    }
  }],

  ['support test: bridging counts, overhanging does not', () => {
    // a slab carried at its corners is supported even though nothing touches its middle
    const slab = { x: 0, y: 2.5, z: 0, sx: 2.0, sy: 0.3, sz: 2.0, yaw: 0 };
    const legs = [[-0.9, -0.9], [0.9, -0.9], [-0.9, 0.9], [0.9, 0.9]]
      .map(([x, z]) => ({ x, y: 2.05, z, sx: 0.35, sy: 0.6, sz: 0.35, yaw: 0 }));
    assert(Logic.isSupported(slab, [slab, ...legs]), 'a slab on four legs must count as supported');
    // a brick whose centre hangs past its support is not
    const over = { x: -0.967, y: 2.34, z: 0, sx: 0.624, sy: 0.42, sz: 0.7, yaw: 0 };
    const under = { x: -0.644, y: 1.914, z: 0, sx: 0.624, sy: 0.42, sz: 0.7, yaw: 0 };
    assert(!Logic.isSupported(over, [over, under]), 'an overhanging brick must not count as supported');
    // and a block with nothing underneath at all
    assert(!Logic.isSupported({ x: 0, y: 4, z: 0, sx: 0.5, sy: 0.5, sz: 0.5, yaw: 0 }, []), 'mid-air block');
  }],

  ['archetypes keep their defining feature', () => {
    // the support prune must never strip a structure back to its legs
    const feature = {
      table: (lv) => lv.blocks.some(b => b.sx > 1.2 && b.sy < 0.4),            // the tabletop
      arch: (lv) => lv.blocks.some(b => b.sx > 0.9 && b.sy < 0.4),             // a lintel
      cross: (lv) => lv.blocks.filter(b => Math.abs(b.y - lv.blocks[0].y) < 1e-6).length >= 5,
    };
    for (const n of [7, 307, 997, 4, 304, 964, 6, 306, 996]) {
      const lv = Logic.level(n);
      const f = feature[lv.archetype];
      if (f) assert(f(lv), `level ${n} (${lv.archetype}) lost its defining structure (${lv.blocks.length} blocks)`);
      assert(lv.blocks.length >= MIN_BLOCKS, `level ${n} (${lv.archetype}) was pruned to ${lv.blocks.length} blocks`);
    }
  }],

  ['every block in a generated level rests on something', () => {
    for (const n of [1, 4, 14, 134, 362, 500, 777, 1000]) {
      const blocks = Logic.level(n).blocks;
      for (const b of blocks)
        assert(Logic.isSupported(b, blocks), `level ${n}: a ${b.type} block is floating in mid-air`);
    }
  }],

  ['a level never clears itself before the first shot', () => {
    for (const n of [134, 202, 362, 404, 494]) {          // these collapsed on their own once
      const s = simFor(n);
      for (let i = 0; i < 150; i++) s.tick();
      assertEq(s.clearedCount, 0, `level ${n} collapsed with nobody shooting`);
      s.destroy();
    }
  }],

  ['no block is too heavy for a cannonball to move', () => {
    const ballMass = PHYS.ballDensity * (4 / 3) * Math.PI * Math.pow(PHYS.ballRadius, 3);
    for (const n of [7, 17, 117, 327, 500, 997]) {
      for (const b of Logic.level(n).blocks) {
        const mass = TYPES[b.type].density * b.sx * b.sy * b.sz;
        assert(mass <= Logic.MAX_MASS + 1e-6, `level ${n}: a ${b.type} block weighs ${mass.toFixed(2)} (cap ${Logic.MAX_MASS})`);
        assert(mass < ballMass * 12, `level ${n}: block far heavier than the ball`);
      }
    }
  }],

  ['score adds up: blocks + clear bonus + unused balls', () => {
    const s = simFor(1);
    const r = s.runBot();
    assertEq(r.status, 'cleared');
    assertEq(s.finalScore(), s.blockPoints + Logic.clearBonus() + Logic.ballBonus(s.ballsLeft));
    assert(s.blockPoints >= 100 * s.blocks.length / 5, 'every cleared block should have scored');
    s.destroy();
  }],
];

function runSelfTests() {
  const failures = [];
  for (const [name, fn] of TESTS) { try { fn(); } catch (e) { failures.push(`${name}: ${e.message}`); } }
  return { total: TESTS.length, failures };
}
/* ##### END TESTS ##### */

function loadBackdrop() {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = './backdrop.png';
  });
}

/* ---------- boot ---------- */
(async () => {
  document.title = CONFIG.title;
  const backdropP = loadBackdrop();
  try {
    await RAPIER.init();
  } catch (e) {
    // The physics engine is WebAssembly. Some sandboxed viewers block WebAssembly entirely
    // (no 'wasm-unsafe-eval' in their CSP); say so plainly instead of showing a raw error.
    const blocked = /WebAssembly|unsafe-eval|CompileError/i.test(String(e && e.message || e));
    document.getElementById('loading').innerHTML = blocked
      ? '<div style="max-width:32em;text-align:center;line-height:1.6;padding:24px">'
        + '<b style="font-size:19px;color:#f2f6ff">This viewer blocks WebAssembly</b><br>'
        + 'Cannonfall runs its 3D physics in WebAssembly, which this embedded viewer will not allow. '
        + 'Open the downloaded <code>cannonfall.html</code> in a browser, or host it on your site, and it will run normally.</div>'
      : 'Could not start: ' + (e && e.message || e);
    return;
  }
  View.init(await backdropP);
  Input.init();

  Scenes.register('menu', MenuScene);
  Scenes.register('levels', LevelsScene);
  Scenes.register('game', GameScene);
  Scenes.register('gameover', GameOverScene);
  Scenes.register('highscores', HighScoresScene);

  window.addEventListener('resize', () => View.resize());
  document.addEventListener('visibilitychange', () => { if (document.hidden) Scenes.current?.onHidden?.(); });

  let last = performance.now();
  function frame(now) {
    const dtMs = Math.min(100, now - last);
    last = now;
    try {
      Scenes.current?.update?.(dtMs);
      View.updateFx(dtMs / 1000);
      View.render();
    } catch (e) { showFatal(e.message || String(e)); throw e; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('loading').remove();
  await Scenes.go('menu');

  /* test hook -- harmless in production, used by scripts/verify.py and checks.js */
  window.__game = {
    ready: true,
    get scene() { return Scenes.current?.name; },
    get busy() { return Scenes.busy; },
    get score() { return Scenes.current?.score ?? null; },
    get sceneObj() { return Scenes.current; },
    state() { const d = Scenes.current?.debugState?.(); return d == null ? null : JSON.parse(JSON.stringify(d)); },
    buttons() {
      const out = [];
      for (const b of document.querySelectorAll('#ui button')) {
        const r = b.getBoundingClientRect();
        if (r.width && r.height && b.offsetParent !== null)
          out.push({ label: b.textContent.trim(), x: r.left + r.width / 2, y: r.top + r.height / 2 });
      }
      return out;
    },
    boardObjects() { return View.blockMeshes.filter(m => m.visible).length + View.ballMeshes.filter(m => m.visible).length; },
    inputStats() { return { ...Scenes.inputStats }; },
    addScore(n) { const s = Scenes.current; if (s && s.addScore) { s.addScore(n); return true; } return false; },
    forceGameOver() { const s = Scenes.current; if (s && s.endRun) { s.endRun(); return true; } return false; },
    selfTest: runSelfTests,
    highScores: () => HighScores.list(),
    resetProgress() { Progress.reset(); HighScores.clear(); },
  };
})().catch(e => showFatal(e.message || String(e)));

</script>
</body>
</html>
